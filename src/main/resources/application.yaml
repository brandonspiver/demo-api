server:
  port: 8081

spring:
  application:
    name: demo-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1}
    driverClassName: org.h2.Driver
    username: ${SPRING_DATA_SOURCE_USERNAME:sa}
    password: ${SPRING_DATA_SOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.brandon.demoapi: DEBUG
    org.springframework: INFO